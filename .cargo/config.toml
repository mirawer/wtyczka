# Windows release binaries must not require a separately installed VC++ runtime.
# Target-scoped flags leave Linux builds and cross-build host proc macros alone.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static"]
