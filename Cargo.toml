[package]
name = "screen-answer"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "Hotkey-triggered visual multiple-choice assistant for Linux and Windows"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
ksni = "0.3"
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi",
    "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
    "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Ole",
    "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry",
    "Win32_System_StationsAndDesktops", "Win32_System_Threading",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
